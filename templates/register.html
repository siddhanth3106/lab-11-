{% extends "base.html" %}

{% block title %}Register New Account | Validation System{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <div class="icon-badge">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="8.5" cy="7" r="4"></circle>
                <line x1="20" y1="8" x2="20" y2="14"></line>
                <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
        </div>
        <h1>Register New User</h1>
        <p>Add a new user record directly to the database</p>
    </div>

    <!-- Error alert -->
    {% if error %}
    <div class="alert alert-danger" role="alert">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="15" y1="9" x2="9" y2="15"></line>
            <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
        <span>{{ error }}</span>
    </div>
    {% endif %}

    <form action="{{ url_for('register') }}" method="POST" autocomplete="off">
        <div class="form-group">
            <label for="full_name">Full Name</label>
            <input 
                type="text" 
                id="full_name" 
                name="full_name" 
                class="form-control" 
                placeholder="e.g. John Doe"
                required
            >
        </div>

        <div class="form-group">
            <label for="username">Login Name / Username</label>
            <input 
                type="text" 
                id="username" 
                name="username" 
                class="form-control" 
                placeholder="Choose a unique username"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input 
                type="password" 
                id="password" 
                name="password" 
                class="form-control" 
                placeholder="Enter password (min 6 characters)"
                required
            >
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input 
                type="password" 
                id="confirm_password" 
                name="confirm_password" 
                class="form-control" 
                placeholder="Re-enter password"
                required
            >
        </div>

        <button type="submit" class="btn btn-primary" style="margin-bottom: 12px;">Create Database Record</button>
        <a href="{{ url_for('login') }}" class="btn btn-secondary">Back to Login</a>
    </form>
</div>
{% endblock %}
